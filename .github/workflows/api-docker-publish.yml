name: API Docker publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'api/**'
      - '.github/workflows/api-docker-publish.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: api-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image name (lowercase for GHCR)
        id: image
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          name_lc=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_lc}/${name_lc}-api" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=api-
            type=raw,value=api-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},prefix=api-v

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            composer_auth=${{ secrets.COMPOSER_AUTH }}
