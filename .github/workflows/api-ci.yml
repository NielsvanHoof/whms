# Dedoc Scramble Pro: `composer.lock` lists a Satis zip *and* a GitHub git source. If the Satis
# download fails (wrong/missing http-basic), Composer falls back to cloning dedoc/scramble-pro,
# which needs a GitHub token with access to that private repo.
#
# Repository secrets:
# - COMPOSER_AUTH: JSON for Composer (http-basic for satis.dedoc.co). Optionally include
#   "github-oauth": {"github.com": "ghp_..."} in the same JSON (see Composer COMPOSER_AUTH docs).
# - COMPOSER_GITHUB_TOKEN (optional): a fine-grained or classic PAT; we run
#   `composer config --global github-oauth.github.com` so git fallback works without embedding
#   the token inside COMPOSER_AUTH.

name: API CI

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, bcmath, gd, openssl, pdo, pdo_sqlite, pdo_mysql, zip, intl
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-v2-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-v2-
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -n "${COMPOSER_GITHUB_TOKEN:-}" ]; then
            composer config --global github-oauth.github.com "${COMPOSER_GITHUB_TOKEN}"
          fi
          composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: composer run analyze

      - name: Run tests
        run: php artisan test --compact

  image:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          secrets: |
            composer_auth=${{ secrets.COMPOSER_AUTH }}
            composer_github_token=${{ secrets.COMPOSER_GITHUB_TOKEN }}
